<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F3D2E">
  <title>Despensa Pro · MANAGEMENT TECH GEO</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-color-theme="esmeralda" data-mode="light">
  <div class="app-shell">
    <header class="top-bar">
      <div>
        <div class="brand">MANAGEMENT TECH GEO</div>
        <div class="subtitle" id="header-subtitle">🏠 Hogar Principal · Versión Web</div>
      </div>
      <div class="top-actions">
        <button class="pill-btn" id="theme-mode-btn" type="button" title="Cambiar modo claro/oscuro">🌓 Tema</button>
      </div>
    </header>

    <main id="app-main" class="main-content"></main>
  </div>

  <!-- Floating Add Button -->
  <button class="fab-3d" id="fab-add" type="button" aria-label="Añadir producto">+</button>

  <!-- 3D / 4D Extruded Floating Bottom Dock -->
  <div class="dock-wrapper">
    <div class="dock-plinth"></div>
    <nav class="dock-bar" aria-label="Navegación principal">
      <button class="dock-btn active" data-tab="home" type="button">
        <span class="dock-icon">🏠</span>
        <span class="dock-label">Hoy</span>
      </button>
      <button class="dock-btn" data-tab="pantry" type="button">
        <span class="dock-icon">🛍️</span>
        <span class="dock-label">Despensa</span>
      </button>
      <button class="dock-btn" data-tab="cooking" type="button">
        <span class="dock-icon">🍳</span>
        <span class="dock-label">Cocina</span>
      </button>
      <button class="dock-btn" data-tab="shopping" type="button">
        <span class="dock-icon">🛒</span>
        <span class="dock-label">Lista</span>
      </button>
      <button class="dock-btn" data-tab="household" type="button">
        <span class="dock-icon">⚙️</span>
        <span class="dock-label">Hogar</span>
      </button>
    </nav>
  </div>

  <!-- Modal Root -->
  <div id="modal-backdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div id="modal-card" class="modal-card"></div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
